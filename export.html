<!doctype html>
<html>
    <head>
        <link href="styles.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=chevron_backward"
            rel="stylesheet"
        />
        <script src="export.js" type="module"></script>
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <meta name="darkreader-lock" />
        <title>Export your drives</title>
    </head>
    <body id="body">
        <a class="mulish-normal button backButton" href="list.html">
            <span class="material-symbols-outlined">chevron_backward</span>
            Back
        </a>
        <h1 class="centred mulish-normal">Export Drives</h1>
        <button class="mulish-normal button primaryButton" id="exportCsv">
            Export as CSV
        </button>
        <button class="mulish-normal button primaryButton" id="exportForm">
            Fill out driving form!
        </button>
        <p class="mulish-normal padding">
            After finishing your driving, you may need to fill out
            <a
                href="https://www.maine.gov/sos/sites/maine.gov.sos/files/inline-files/MVE-21%20Permittee%20Driving%20Log%20Rev%205-22.pdf"
                class="link"
                >this form.</a
            >
        </p>
        <p class="mulish-normal padding">
            It's also a good idea to regularly backup your drive CSV.
        </p>
    </body>
</html>
